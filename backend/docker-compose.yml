services:
  db:
    image: postgres:16
    container_name: dop_postgres
    command: [ "postgres", "-c", "listen_addresses=*", "-c", "password_encryption=scram-sha-256" ]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: adirtka_kettle
      POSTGRES_DB: dop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: dop_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dop_adirtka
      MINIO_ROOT_PASSWORD: dop_adirtka_kettle
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

volumes:
  postgres_data:
  minio_data: